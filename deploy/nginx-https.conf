# Install after certbot issues the questkeeps.ru certificate.
limit_req_zone $binary_remote_addr zone=questkeeps_auth:10m rate=5r/m;
map $uri $questkeeps_log_path {
    default $uri;
    ~^/(s|join|friend)/ /$1/[redacted];
    ~^/api/(share|invites)/ /api/$1/[redacted];
}
log_format questkeeps_private '$remote_addr [$time_local] "$request_method $questkeeps_log_path $server_protocol" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name questkeeps.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/questkeeps-acme;
    }
    location / { return 301 https://questkeeps.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name questkeeps.ru;
    ssl_certificate /etc/letsencrypt/live/questkeeps.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/questkeeps.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/questkeeps.access.log questkeeps_private;
    error_log /var/log/nginx/questkeeps.error.log warn;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=86400" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    location ~ ^/(?:\.env|\.git|data|backups)(?:[/.]|$) { return 404; }
    location ~ ^/api/auth/(?:login|register)/?$ {
        limit_req zone=questkeeps_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://questkeeps_backend;
    }
    # Hashed assets are retained across releases for already-open browser tabs.
    location ^~ /_next/static/ {
        alias /opt/questkeeps/static-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location / { proxy_pass http://questkeeps_backend; }
}
