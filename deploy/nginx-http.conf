# Bootstrap only. Add TLS before making the application public.
# Place in /etc/nginx/sites-available/questkeeps.
limit_req_zone $binary_remote_addr zone=questkeeps_auth:10m rate=5r/m;
map $uri $questkeeps_log_path {
    default $uri;
    ~^/(s|join|friend)/ /$1/[redacted];
}
log_format questkeeps_private '$remote_addr [$time_local] "$request_method $questkeeps_log_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name questkeeps.ru;
    server_tokens off;
    access_log /var/log/nginx/questkeeps.access.log questkeeps_private;
    error_log /var/log/nginx/questkeeps.error.log warn;
    client_max_body_size 6m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/questkeeps-acme;
    }

    # Require HTTPS before processing passwords or issuing sessions.
    location / {
        default_type text/plain;
        return 503 "QuestKeeps deployment in progress. HTTPS setup pending.\n";
    }
}
